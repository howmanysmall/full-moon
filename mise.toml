min_version = "2024.11.0"

[tools]
rust = "1.93.1"
oxfmt = "0.54.0"
cargo-binstall = "latest"
"cargo:cargo-insta" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-fuzz" = "latest"

[env]
PROJECT_NAME = "{{ config_root | basename }}"
_.file = { path = ".env" }

[settings]
auto_install = false
lockfile = true

[tasks]
[tasks.build]
description = "Build all workspace crates in release mode"
run = "cargo build --release"
sources = ["**/*.rs", "**/Cargo.toml", "**/Cargo.lock"]

[tasks.build-dev]
description = "Build all workspace crates in debug mode (fast compile)"
run = "cargo build"
sources = ["**/*.rs", "**/Cargo.toml", "**/Cargo.lock"]

[tasks.format]
description = "Check formatting with rustfmt. Exits non-zero if unformatted."
run = "cargo fmt --all -- --check"
sources = ["**/*.rs"]

[tasks.format-fix]
description = "Apply rustfmt formatting to all crates"
run = "cargo fmt --all"

[tasks.lint]
description = "Run Clippy with all features and targets. Fails on any warning."
run = "cargo clippy --all-targets --all-features -- -D warnings"
sources = ["**/*.rs", "**/Cargo.toml"]

[tasks.test]
description = "Run the full test suite with all features via nextest"
run = "cargo nextest run --all-features"
sources = ["**/*.rs", "**/Cargo.toml", "**/tests/**/*.rs"]

[tasks.test-std]
description = "Run tests with standard cargo test runner (no nextest required)"
run = "cargo test --all-features"
sources = ["**/*.rs", "**/Cargo.toml", "**/tests/**/*.rs"]

[tasks.snapshots]
description = "Review and accept insta snapshot changes interactively"
run = "cargo insta review"

[tasks.doc]
description = "Build rustdoc with all Lua dialect features enabled (docs.rs parity)"
run = "RUSTDOCFLAGS='--cfg docsrs' cargo doc --features luau,lua52,lua53,lua54,luajit,cfxlua --no-deps"
sources = ["**/*.rs", "**/Cargo.toml"]

[tasks.doc-open]
description = "Build docs and open in browser"
run = "RUSTDOCFLAGS='--cfg docsrs' cargo doc --features luau,lua52,lua53,lua54,luajit,cfxlua --no-deps --open"
sources = ["**/*.rs", "**/Cargo.toml"]

[tasks.fuzz-parse]
description = "Fuzz the parser target (30s timeout per run)"
run = "cargo fuzz run parse -- -max_total_time=30"
dir = "full-moon/fuzz"

[tasks.fuzz-parity]
description = "Fuzz the parser parity target (compare against old full_moon)"
run = "cargo fuzz run parse_parity -- -max_total_time=30"
dir = "full-moon/fuzz"

[tasks.fuzz]
description = "Run both fuzz targets sequentially"
depends = ["fuzz-parse", "fuzz-parity"]

[tasks.bench]
description = "Run criterion benchmarks"
run = "cargo bench"
sources = ["benches/**/*.rs", "benches/**/*.lua"]

[tasks.verify]
description = "Full local verification: format check + lint + test + build"
depends = ["format", "lint", "test", "build"]

[tasks.ci]
description = "CI pipeline: format + lint + test + build + doc"
depends = ["format", "lint", "test", "build", "doc"]
